# Builds quiver for every pushed version tag (v0.1.0, v0.2.0, ...) and attaches
# a .deb and a plain Linux binary to the GitHub release, so people don't have to compile.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside Debian 13 so the .deb matches the libraries Debian/Ubuntu users have.
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev libgtk4-layer-shell-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked --release

      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --locked

      - name: Collect release files
        run: |
          mkdir dist
          cp target/debian/*.deb dist/
          tar -C target/release -czf "dist/quiver-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" quiver
          cd dist && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: quiver-linux
          path: dist/*

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
