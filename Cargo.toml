[package]
name = "quiver"
version = "0.1.0"
edition = "2024"
description = "PowerToys-style tools for Hyprland"
license = "GPL-3.0-only"
repository = "https://github.com/alon3wolfus/quiver"
readme = "README.md"
keywords = ["hyprland", "wayland", "launcher", "powertoys", "gtk4"]
categories = ["command-line-utilities", "gui"]

[dependencies]
anyhow = "1.0.104"
cairo-rs = { version = "0.22", features = ["png"] }
clap = { version = "4.6.7", features = ["derive"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
lto = "thin"
strip = true

# `cargo deb` builds a .deb for Debian 13+ / Ubuntu 25.04+ (see README).
[package.metadata.deb]
maintainer = "alon3wolfus <260382617+alon3wolfus@users.noreply.github.com>"
copyright = "alon3wolfus"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
quiver brings Microsoft PowerToys-style tools to Hyprland: a Spotlight-style \
launcher, FancyZones-like window layouts, always on top, a colour picker, \
text extraction (OCR), bulk rename and an image resizer, plus a settings window. \
Needs Hyprland 0.55 or newer (Lua config)."""
depends = "libc6 (>= 2.39), libgtk-4-1 (>= 4.12), libgtk4-layer-shell0"
recommends = "hyprland (>= 0.55), hyprpicker, grim, slurp, wl-clipboard, tesseract-ocr, tesseract-ocr-eng, libnotify-bin, plocate"
assets = [
    ["target/release/quiver", "usr/bin/", "755"],
    ["packaging/quiver.desktop", "usr/share/applications/", "644"],
    ["packaging/quiver.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/quiver/", "644"],
]
