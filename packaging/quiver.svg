<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- quiver: three arrows in a quiver on a rounded blue tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78b0ff"/>
      <stop offset="1" stop-color="#2c66dc"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e6ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#tile)"/>

  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="#ffffff">
    <!-- shafts -->
    <line x1="50" y1="64" x2="46" y2="32"/>
    <line x1="64" y1="64" x2="64" y2="24"/>
    <line x1="78" y1="64" x2="82" y2="32"/>
  </g>
  <g fill="#ffffff">
    <!-- arrow heads -->
    <polygon points="44.6,21 37.5,35 52.5,33"/>
    <polygon points="64,13 56.5,27 71.5,27"/>
    <polygon points="83.4,21 75.5,33 90.5,35"/>
  </g>

  <!-- the quiver -->
  <path d="M40 58 H88 L81 104 A7 7 0 0 1 74 110 H54 A7 7 0 0 1 47 104 Z" fill="url(#body)"/>
  <rect x="40" y="56" width="48" height="8" rx="4" fill="#ffffff"/>
  <path d="M52 76 H76 M54 90 H74" stroke="#9fc0f5" stroke-width="3" stroke-linecap="round"/>
</svg>
